<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Item HTML Generator</title>
    <!-- Using Tailwind CSS for clean, modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* A little extra style for the copy button feedback */
        .copied {
            background-color: #22c55e !important;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans p-4 sm:p-8">

    <div class="max-w-xl mx-auto bg-white p-6 sm:p-8 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">News Link Generator</h1>

        <!-- Input Form -->
        <div class="space-y-4">
            <div>
                <label for="link" class="block text-sm font-medium text-gray-700">Link URL</label>
                <input type="url" id="link" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" placeholder="https://www.example.com/article">
            </div>
            
            <div>
                <label for="headline" class="block text-sm font-medium text-gray-700">Headline</label>
                <input type="text" id="headline" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Residents weigh in on deal...">
            </div>
            
            <div>
                <label for="publication" class="block text-sm font-medium text-gray-700">Publication Name</label>
                <input type="text" id="publication" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Chattanooga Times Free Press">
            </div>
            
            <div>
                <label for="date" class="block text-sm font-medium text-gray-700">Date</label>
                <input type="text" id="date" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Oct 26 2025">
            </div>
        </div>

        <!-- Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 mt-6">
            <button id="generate-btn" class="w-full sm:w-1/2 bg-blue-600 text-white py-2 px-4 rounded-md font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                Generate HTML
            </button>
            <button id="copy-btn" class="w-full sm:w-1/2 bg-gray-600 text-white py-2 px-4 rounded-md font-semibold hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50 transition-colors duration-200">
                Copy to Clipboard
            </button>
        </div>

        <!-- Message Area -->
        <p id="message" class="text-red-600 font-medium text-sm text-center mt-4 h-5"></p>

        <!-- Output Area -->
        <div class_="mt-4">
            <label for="output-code" class="block text-sm font-medium text-gray-700">Generated HTML:</label>
            <textarea id="output-code" class="mt-1 w-full h-40 p-2 border border-gray-300 rounded-md bg-gray-50 font-mono text-sm shadow-inner" readonly></textarea>
        </div>
    </div>

    <script>
        // Get all the elements we need
        const linkIn = document.getElementById('link');
        const headlineIn = document.getElementById('headline');
        const publicationIn = document.getElementById('publication');
        const dateIn = document.getElementById('date');
        const generateBtn = document.getElementById('generate-btn');
        const copyBtn = document.getElementById('copy-btn');
        const outputArea = document.getElementById('output-code');
        const message = document.getElementById('message');

        // Helper function to get today's date in the right format
        function getTodayDate() {
            const options = { month: 'short', day: '2-digit', year: 'numeric' };
            // Replaces "Oct 28, 2025" with "Oct 28 2025"
            return new Date().toLocaleDateString('en-US', options).replace(',', '');
        }

        // Pre-fill the date field to save time
        dateIn.value = getTodayDate();

        // --- Generate Button Click ---
        generateBtn.addEventListener('click', () => {
            // Get values from inputs
            const linkVal = linkIn.value;
            const headlineVal = headlineIn.value;
            const pubVal = publicationIn.value;
            const dateVal = dateIn.value;

            // Simple validation
            if (!linkVal || !headlineVal || !pubVal || !dateVal) {
                message.textContent = 'Please fill out all fields.';
                return;
            }
            message.textContent = ''; // Clear any error message

            // Build the HTML template using backticks (`) to preserve formatting
            // We use &nbsp; for the spaces around the pipe, as requested
            const template = `    <li>
        <a class="headline" href="${linkVal}" target="_blank">${headlineVal}</a>
        <p class="meta">${pubVal} &nbsp;&nbsp;|&nbsp;&nbsp; ${dateVal}</p>
    </li>`;

            // Put the generated HTML into the textarea
            outputArea.value = template;
        });

        // --- Copy Button Click ---
        copyBtn.addEventListener('click', () => {
            if (outputArea.value === '') {
                message.textContent = 'Nothing to copy. Please generate code first.';
                return;
            }
            message.textContent = '';

            // Select the text and copy it
            outputArea.select();
            // Use execCommand for broad compatibility, especially in iFrames
            document.execCommand('copy');

            // --- Visual Feedback ---
            // Deselect the text
            window.getSelection().removeAllRanges();
            
            // Temporarily change button text and color
            copyBtn.textContent = 'Copied!';
            copyBtn.classList.add('copied');

            // Change it back after 2 seconds
            setTimeout(() => {
                copyBtn.textContent = 'Copy to Clipboard';
                copyBtn.classList.remove('copied');
            }, 2000);
        });
    </script>

</body>
</html>
